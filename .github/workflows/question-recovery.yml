name: Question recovery boundary
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  database-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix "$RUNNER_TEMP/recovery-tools" --no-save --ignore-scripts @electric-sql/pglite@0.3.14
      - run: node tests/question-recovery-database.mjs
        env:
          RECOVERY_PGLITE_MODULE: ${{ runner.temp }}/recovery-tools/node_modules/@electric-sql/pglite/dist/index.js
