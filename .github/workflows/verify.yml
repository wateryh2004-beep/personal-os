name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: E2E_MOBILE_HARNESS=1 npm run build
      - name: Install mobile E2E browser
        run: |
          npm install --global playwright@1.62.1
          playwright install --with-deps chromium
      - name: Run 360–430px mobile E2E
        env:
          E2E_MOBILE_HARNESS: "1"
          E2E_SCREENSHOT_DIR: test-results/mobile
        run: |
          npm run start -- -p 3000 > /tmp/personal-os-e2e.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/mobile-native-e2e > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/mobile-native-e2e > /dev/null
          NODE_PATH="$(npm root -g)" timeout 180s node scripts/notes-search-e2e.cjs
          NODE_PATH="$(npm root -g)" node scripts/mobile-native-e2e.cjs
          NODE_PATH="$(npm root -g)" timeout 180s node scripts/navigation-latency-e2e.cjs
          NODE_PATH="$(npm root -g)" timeout 180s node scripts/workspace-reliability-e2e.cjs
      - name: Save mobile QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-daily-flow-screenshots
          path: test-results/mobile
          if-no-files-found: ignore
          retention-days: 7
