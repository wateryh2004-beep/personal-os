name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: E2E_MOBILE_HARNESS=1 npm run build
      - name: Install mobile E2E browser
        run: |
          npm install --global playwright@1.62.1
          playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Verify approved Today composition first
        env:
          E2E_MOBILE_HARNESS: "1"
        run: |
          node node_modules/next/dist/bin/next start -p 3000 > /tmp/personal-os-today-e2e.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/mobile-native-e2e > /dev/null; then break; fi
            sleep 1
          done
          NODE_PATH="$(npm root -g)" timeout 240s node scripts/today-hierarchy-e2e.cjs
      - name: Save focused Today hierarchy screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: today-hierarchy-screenshots
          path: test-results/today
          if-no-files-found: ignore
          retention-days: 7
      - name: Run 360–430px mobile E2E
        env:
          E2E_MOBILE_HARNESS: "1"
          E2E_SCREENSHOT_DIR: test-results/mobile
        run: |
          node node_modules/next/dist/bin/next start -p 3000 > /tmp/personal-os-e2e.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/mobile-native-e2e > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/mobile-native-e2e > /dev/null
          NODE_PATH="$(npm root -g)" timeout 180s node scripts/ui-affordance-e2e.cjs
          NODE_PATH="$(npm root -g)" timeout 540s node scripts/leisure-e2e.cjs
          NODE_PATH="$(npm root -g)" timeout 180s node scripts/notes-search-e2e.cjs
          E2E_SCREENSHOT_DIR=test-results/navigation NODE_PATH="$(npm root -g)" timeout 180s node scripts/navigation-refinement-e2e.cjs
          NODE_PATH="$(npm root -g)" node scripts/mobile-native-e2e.cjs
          NODE_PATH="$(npm root -g)" timeout 180s node scripts/navigation-latency-e2e.cjs
          NODE_PATH="$(npm root -g)" timeout 180s node scripts/workspace-reliability-e2e.cjs
      - name: Save mobile QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-daily-flow-screenshots
          path: test-results/mobile
          if-no-files-found: ignore
          retention-days: 7

      - name: Save focused interview QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interview-reading-screenshots
          path: test-results/mobile/interview-*.png
          if-no-files-found: ignore
          retention-days: 7


      - name: Save focused navigation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-refinement-screenshots
          path: test-results/navigation
          if-no-files-found: ignore
          retention-days: 7

      - name: Save focused interaction affordance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-affordance-screenshots
          path: test-results/affordance
          if-no-files-found: ignore
          retention-days: 7
