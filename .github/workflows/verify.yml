name: Verify

on:
  pull_request:
    branches: [main, test/ten-system-improvements]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: E2E_MOBILE_HARNESS=1 npm run build
      - name: Verify traced PDF renderer in a cold package copy
        run: node scripts/verify-pdf-cover-package.mjs
      - name: Install mobile E2E browser
        run: |
          npm install --global playwright@1.62.1
          playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Verify patched MapLibre source attribution in Chromium
        run: NODE_PATH="$(npm root -g)" timeout 90s node scripts/map-attribution-security-e2e.cjs
      - name: Save map attribution security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-attribution-security
          path: test-results/map-attribution-security
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify AI-first reader and correction surfaces
        run: |
          node scripts/ai-first-preview.mjs > /tmp/personal-os-ai-first-e2e.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4186 > /dev/null; then break; fi
            sleep 1
          done
          NODE_PATH="$(npm root -g)" timeout 240s node scripts/ai-first-e2e.cjs
      - name: Save AI-first screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-first-ui-evidence
          path: test-results/ai-first
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify isolated investment workspace
        run: |
          node scripts/investment-preview.mjs > /tmp/personal-os-investment-e2e.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4179 > /dev/null; then break; fi
            sleep 1
          done
          NODE_PATH="$(npm root -g)" timeout 180s node scripts/investment-e2e.cjs
          NODE_PATH="$(npm root -g)" timeout 180s node scripts/investment-daily-e2e.cjs
      - name: Save focused investment screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investment-workspace-screenshots
          path: test-results/investment
          if-no-files-found: ignore
          retention-days: 7
      - name: Measure streamed Notes startup and warm navigation
        run: |
          E2E_MOBILE_HARNESS=1 node node_modules/next/dist/bin/next start -p 3000 > /tmp/notes-bootstrap-app.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..45}; do
            if curl -fsS 'http://127.0.0.1:3000/mobile-native-e2e?scene=notes-bootstrap&workspace=home' > /dev/null; then break; fi
            sleep 1
          done
          NODE_PATH="$(npm root -g)" timeout 180s node scripts/notes-bootstrap-e2e.cjs
      - name: Save Notes startup measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-bootstrap-evidence
          path: test-results/notes-bootstrap
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify isolated Settings workspace
        run: |
          node scripts/settings-preview.mjs > /tmp/personal-os-settings-e2e.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4183 > /dev/null; then break; fi
            sleep 1
          done
          NODE_PATH="$(npm root -g)" timeout 180s node scripts/settings-workspace-e2e.cjs
      - name: Save focused Settings screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-workspace-evidence
          path: test-results/settings-workspace
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify approved Today composition first
        env:
          E2E_MOBILE_HARNESS: "1"
        run: |
          node node_modules/next/dist/bin/next start -p 3000 > /tmp/personal-os-today-e2e.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/mobile-native-e2e > /dev/null; then break; fi
            sleep 1
          done
          NODE_PATH="$(npm root -g)" timeout 240s node scripts/today-hierarchy-e2e.cjs
      - name: Save focused Today hierarchy screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: today-hierarchy-screenshots
          path: test-results/today
          if-no-files-found: ignore
          retention-days: 7
      - name: Run 360–430px mobile E2E
        env:
          E2E_MOBILE_HARNESS: "1"
          E2E_SCREENSHOT_DIR: test-results/mobile
        run: |
          node node_modules/next/dist/bin/next start -p 3000 > /tmp/personal-os-e2e.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/mobile-native-e2e > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/mobile-native-e2e > /dev/null
          NODE_PATH="$(npm root -g)" timeout 180s node scripts/core-flows-e2e.cjs
          NODE_PATH="$(npm root -g)" timeout 180s node scripts/files-recovery-e2e.cjs
          NODE_PATH="$(npm root -g)" timeout 180s node scripts/files-browser-e2e.cjs
          NODE_PATH="$(npm root -g)" timeout 180s node scripts/r2-storage-settings-e2e.cjs
          NODE_PATH="$(npm root -g)" timeout 180s node scripts/ui-affordance-e2e.cjs
          NODE_PATH="$(npm root -g)" timeout 540s node scripts/leisure-e2e.cjs
          NODE_PATH="$(npm root -g)" timeout 180s node scripts/notes-search-e2e.cjs
          E2E_SCREENSHOT_DIR=test-results/navigation NODE_PATH="$(npm root -g)" timeout 180s node scripts/navigation-refinement-e2e.cjs
          NODE_PATH="$(npm root -g)" node scripts/mobile-native-e2e.cjs
          NODE_PATH="$(npm root -g)" timeout 180s node scripts/navigation-latency-e2e.cjs
          NODE_PATH="$(npm root -g)" timeout 180s node scripts/workspace-reliability-e2e.cjs
      - name: Save R2 storage settings screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-storage-settings-evidence
          path: test-results/r2-storage-settings
          if-no-files-found: ignore
          retention-days: 7

      - name: Save Files browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: files-browser-evidence
          path: test-results/files-browser
          if-no-files-found: ignore
          retention-days: 7

      - name: Save genuine PDF renderer samples and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-renderer-evidence
          path: test-results/pdf-renderer
          if-no-files-found: ignore
          retention-days: 7

      - name: Save Files recovery screenshots and synthetic packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: files-recovery-evidence
          path: test-results/files-recovery
          if-no-files-found: ignore
          retention-days: 7

      - name: Save mobile QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-daily-flow-screenshots
          path: test-results/mobile
          if-no-files-found: ignore
          retention-days: 7

      - name: Save focused interview QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interview-reading-screenshots
          path: test-results/mobile/interview-*.png
          if-no-files-found: ignore
          retention-days: 7


      - name: Save focused navigation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-refinement-screenshots
          path: test-results/navigation
          if-no-files-found: ignore
          retention-days: 7

      - name: Save focused interaction affordance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-affordance-screenshots
          path: test-results/affordance
          if-no-files-found: ignore
          retention-days: 7

      - name: Save focused core-flow screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-flow-screenshots
          path: test-results/core-flows
          if-no-files-found: ignore
          retention-days: 7

  pdf-cached-covers:
    name: Cached PDF covers / synthetic browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No production credentials, R2 access, or real documents are provided.
    env:
      E2E_MOBILE_HARNESS: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Install isolated browser and screenshot fonts
        run: |
          npm install --global playwright@1.62.1
          playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Verify covers, HTTP revalidation, fallback, and reader boundaries
        run: |
          mkdir -p test-results/pdf-cached-covers
          node node_modules/next/dist/bin/next start -p 3000 > test-results/pdf-cached-covers/app.log 2>&1 &
          APP_PID=$!
          node scripts/pdf-covers-fixture-proxy.cjs > test-results/pdf-cached-covers/fixture.log 2>&1 &
          FIXTURE_PID=$!
          trap 'kill "$APP_PID" "$FIXTURE_PID" 2>/dev/null || true; wait "$APP_PID" "$FIXTURE_PID" 2>/dev/null || true' EXIT
          for attempt in {1..45}; do
            if curl -fsS 'http://127.0.0.1:4187/mobile-native-e2e?scene=files-cached-covers' > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS 'http://127.0.0.1:4187/mobile-native-e2e?scene=files-cached-covers' > /dev/null
          NODE_PATH="$(npm root -g)" timeout 300s node scripts/pdf-cached-covers-e2e.cjs
      - name: Save 360px, 390px, and 1440px screenshots and network evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-cached-covers-evidence
          path: test-results/pdf-cached-covers
          if-no-files-found: ignore
          retention-days: 7

  pdf-cover-sql:
    name: Cached PDF cover jobs / PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ephemeral-fixture-only
          POSTGRES_DB: pdf_cover_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ephemeral-fixture-only@127.0.0.1:5432/pdf_cover_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Verify migration, access controls, retry leases, and concurrent claims
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/pdf-cover-sql/bootstrap.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261007062235_cached_pdf_cover_jobs.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/pdf-cover-sql/regression.sql
          python scripts/pdf-cover-sql-concurrency.py

  investment-sql:
    strategy:
      matrix:
        postgres: ["16", "17"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: ephemeral-fixture-only
          POSTGRES_DB: investment_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ephemeral-fixture-only
      PGDATABASE: investment_fixture
    steps:
      - uses: actions/checkout@v4
      - name: Verify SQL in an isolated synthetic database
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/investment-sql/bootstrap.sql
          for MIGRATION in supabase/migrations/*_investment_journal_v1.sql supabase/migrations/*_investment_trigger_execute_boundary.sql supabase/migrations/*_investment_daily_overview.sql; do
            test -f "$MIGRATION"
            psql -v ON_ERROR_STOP=1 -f "$MIGRATION"
          done
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/investment-sql/regression.sql
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/investment-sql/daily-regression.sql
          python3 scripts/investment-sql-concurrency.py
          python3 scripts/investment-daily-sql-concurrency.py

  complete-module-search-sql:
    name: Complete module search / PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ephemeral-fixture-only
          POSTGRES_DB: module_search_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ephemeral-fixture-only
      PGDATABASE: module_search_test
    steps:
      - uses: actions/checkout@v4
      - name: Verify coverage, RLS, archives, literal queries and stable ranking
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/module-search/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261007093000_complete_module_search.sql
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/module-search/regression.sql

  file-search-availability-sql:
    name: File publication / search visibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ephemeral-fixture-only
          POSTGRES_DB: file_search_visibility_test
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ephemeral-fixture-only
      PGDATABASE: file_search_visibility_test
    steps:
      - uses: actions/checkout@v4
      - name: Verify pending, cancelled, committed and archived visibility
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/file-search-availability/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261007102000_file_search_availability.sql
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/file-search-availability/regression.sql
