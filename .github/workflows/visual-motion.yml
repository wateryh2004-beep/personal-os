name: Visual motion polish

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-motion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Visual motion / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: editorial-notes-files
            script: editorial-notes-files-e2e.cjs
            timeout: 360
          - suite: shell-visual
            script: shell-visual-e2e.cjs
            timeout: 240
          - suite: planning-visual
            script: planning-visual-e2e.cjs
            timeout: 300
    env:
      E2E_MOBILE_HARNESS: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      E2E_BASE_URL: http://127.0.0.1:3000
      EDITORIAL_E2E_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Install Chromium and CJK fonts
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS python3 scripts/ci-prefer-ubuntu-mirror.py
          npm install --global playwright@1.62.1
          playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Exercise the isolated synthetic visual flow
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 -p 3000 > /tmp/visual-motion-app.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..45}; do
            if curl -fsS 'http://127.0.0.1:3000/mobile-native-e2e?scene=workspace-motion' > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS 'http://127.0.0.1:3000/mobile-native-e2e?scene=workspace-motion' > /dev/null
          NODE_PATH="$(npm root -g)" timeout '${{ matrix.timeout }}s' node 'scripts/${{ matrix.script }}'
      - name: Save screenshots, continuous video and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-motion-${{ matrix.suite }}
          path: |
            test-results/${{ matrix.suite }}
            /tmp/visual-motion-app.log
          if-no-files-found: ignore
          retention-days: 7
