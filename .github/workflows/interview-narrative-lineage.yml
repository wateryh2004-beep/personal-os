name: Interview narrative lineage

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261021053000_interview_narrative_lineage.sql"
      - "tests/interview_narrative_db.py"
      - ".github/workflows/interview-narrative-lineage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lineage-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Test version lineage, same-owner constraints, stale references and RLS
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: python tests/interview_narrative_db.py
