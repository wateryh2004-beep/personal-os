name: System standards v2
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: system-standards-${{ github.ref }}
  cancel-in-progress: true
jobs:
  design-and-code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_MOBILE_HARNESS: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: node scripts/system-standards-audit.mjs --check --json=system-standards.json
      - run: npm run build
      - run: node scripts/check-runtime-closure.mjs
      - name: Install browser and CJK fonts
        run: |
          npm install --global playwright@1.62.1
          playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Verify synthetic scenes and motion
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 -p 3000 > /tmp/design-v2.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true; wait "$APP_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS 'http://127.0.0.1:3000/mobile-native-e2e?scene=projects' > /dev/null; then break; fi
            sleep 1
          done
          NODE_PATH="$(npm root -g)" timeout 180s node scripts/design-v2-e2e.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-standards-v2-evidence
          path: |
            system-standards.json
            test-results/design-v2
          if-no-files-found: ignore
          retention-days: 7
