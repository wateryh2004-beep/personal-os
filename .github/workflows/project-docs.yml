name: Project documentation

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/check-project-docs.mjs'
      - '.github/workflows/project-docs.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/check-project-docs.mjs'
      - '.github/workflows/project-docs.yml'

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-project-docs.mjs
