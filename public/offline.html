<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>Personal OS · 离线</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#f5f5f7; color:#1d1d1f; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px; }
      main { width:min(100%,420px); border:1px solid rgba(0,0,0,.08); border-radius:18px; background:rgba(255,255,255,.78); padding:28px; box-shadow:0 16px 50px rgba(0,0,0,.07); }
      h1 { margin:0; font-size:22px; letter-spacing:-.02em; }
      p { margin:12px 0 0; color:#6e6e73; font-size:15px; line-height:1.65; }
      button { margin-top:22px; width:100%; min-height:44px; border:0; border-radius:12px; background:#1d1d1f; color:white; font:inherit; font-weight:600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Personal OS 当前离线</h1>
      <p>为了保护个人数据，离线模式不会缓存任务、笔记、日历或 AI 响应。网络恢复后重新加载即可继续使用。</p>
      <button type="button" onclick="location.reload()">重新连接</button>
    </main>
  </body>
</html>
